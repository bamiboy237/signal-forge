[project]
name = "signal-forge"
version = "0.1.0"
description = "A local sensor-event API with a durable, deterministic processing pipeline."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.4,<3",
    "uvicorn>=0.52.1,<1",
]

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pytest>=9.1.1,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
